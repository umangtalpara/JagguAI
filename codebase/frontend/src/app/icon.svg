<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Main Icon Gradient -->
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#4facfe" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Ambient Internal Glow -->
  <circle cx="64" cy="64" r="38" fill="url(#aiGlow)" opacity="0.18" filter="url(#glow)" />

  <!-- Stylized JaguAI Neural Emblem -->
  <!-- Central Stylized 'J' & AI Core -->
  <path
    d="M 52 34 
       L 76 34 
       C 84 34, 88 38, 88 46 
       L 88 74 
       C 88 88, 76 96, 60 96 
       C 44 96, 38 88, 38 82
       C 38 78, 42 75, 46 75
       C 50 75, 53 78, 56 81
       C 58 83, 60 84, 64 84
       C 71 84, 75 79, 75 72
       L 75 46
       L 52 46
       C 48 46, 46 43, 46 40
       C 46 37, 48 34, 52 34 Z"
    fill="url(#aiGlow)"
    filter="url(#glow)"
  />

  <!-- Neural Sparks & Nodes -->
  <!-- Top Right Spark -->
  <path
    d="M 94 28 C 94 33, 98 37, 103 37 C 98 37, 94 41, 94 46 C 94 41, 90 37, 85 37 C 90 37, 94 33, 94 28 Z"
    fill="url(#sparkleGrad)"
  />

  <!-- Bottom Left Mini Node -->
  <circle cx="34" cy="54" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="34" cy="54" r="2" fill="#ffffff" />

  <!-- Center Core Pulsing Dot -->
  <circle cx="64" cy="58" r="4.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="64" cy="58" r="2.5" fill="#00f2fe" />
</svg>
